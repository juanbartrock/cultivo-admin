# Relay RTSP de la cámara de la carpa (C100 Tapo_C100_Wayra, 192.168.0.109 en la LAN de casa).
# La PC (desktop-casa) hace de puente en sus dos sistemas, cada uno con su IP de Tailscale:
# Windows reenvía con netsh portproxy y Linux con systemd-socket-proxyd, ambos en :554 y solo para el VPS.
# Nunca están online a la vez (dual boot): HAProxy usa el que pase el chequeo.
# tapo-service apunta acá con TAPO_CAMERA_IP=camara-relay. Detalle: /opt/server-audit/CHANGES.md (2026-10-24).
global
    log stdout format raw local0 notice

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 4s
    timeout client 60s
    timeout server 60s
    timeout check 3s

frontend rtsp
    bind :554
    default_backend pc_casa

backend pc_casa
    balance first
    default-server inter 15s fastinter 3s downinter 10s rise 1 fall 2
    server pc-linux   100.75.199.75:554 check
    server pc-windows 100.72.147.26:554 check
