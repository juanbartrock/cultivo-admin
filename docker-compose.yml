services:
  # ============================================
  # Backend API (NestJS)
  # ============================================
  backend:
    build: ./backend
    container_name: cultivo-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
      - CORS_ALLOWED_ORIGINS=https://cultivo.ramsesvii.com
      - REALTIME_ALLOW_GUEST=false
      - MS_SONOFF_URL=http://sonoff-service:3000
      - MS_TUYA_URL=http://tuya-service:3000
      - MS_TAPO_URL=http://tapo-service:3000
      # - MS_ESP32_URL=http://esp32-service:3000
      # Google Cloud TTS (Chirp3-HD)
      - GOOGLE_CLOUD_TTS_API_KEY=${GOOGLE_CLOUD_TTS_API_KEY:-}
    networks:
      - cultivo-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sonoff-service:
        condition: service_healthy
      tuya-service:
        condition: service_healthy
      tapo-service:
        condition: service_healthy
      # esp32-service:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Backend Test Runner (Jest in container)
  # ============================================
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: builder
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=test
      - PORT=4000
      - CORS_ALLOWED_ORIGINS=http://localhost:3001
      - REALTIME_ALLOW_GUEST=false
    networks:
      - cultivo-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm test

  # ============================================
  # Frontend (Next.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://cultivo.ramsesvii.com/api
    container_name: cultivo-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - TZ=America/Argentina/Buenos_Aires
    networks:
      - cultivo-network
    depends_on:
      - backend

  # ============================================
  # IoT Microservices
  # ============================================
  sonoff-service:
    build: ./sonoff-service
    container_name: sonoff-ewelink-service
    restart: unless-stopped
    # Puerto solo accesible via red Docker interna (backend → sonoff-service:3000)
    env_file:
      - ./sonoff-service/.env
    environment:
      - PORT=3000
      - TZ=America/Argentina/Buenos_Aires
    networks:
      - cultivo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  tuya-service:
    build: ./tuya-service
    container_name: tuya-service
    restart: unless-stopped
    # Puerto solo accesible via red Docker interna (backend → tuya-service:3000)
    env_file:
      - ./tuya-service/.env
    environment:
      - PORT=3000
      - TZ=America/Argentina/Buenos_Aires
    networks:
      - cultivo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  tapo-service:
    build: ./tapo-service
    container_name: tapo-service
    restart: unless-stopped
    # Puerto solo accesible via red Docker interna (backend → tapo-service:3000)
    env_file:
      - ./tapo-service/.env
    environment:
      - PORT=3000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - tapo-snapshots:/app/snapshots
    networks:
      - cultivo-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Relay RTSP hacia la cámara de la carpa a través de la PC de casa (Windows o Linux, por Tailscale).
  # tapo-service lo usa con TAPO_CAMERA_IP=camara-relay. Config: camara-relay/haproxy.cfg
  camara-relay:
    image: haproxy:lts-alpine
    container_name: camara-relay
    restart: unless-stopped
    volumes:
      - ./camara-relay/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - cultivo-network

  # ESP32 Service - Deshabilitado temporalmente
  # esp32-service:
  #   build: ./esp32-service
  #   container_name: esp32-service
  #   restart: unless-stopped
  #   ports:
  #     - "3004:3000"
  #   env_file:
  #     - ./esp32-service/.env
  #   environment:
  #     - PORT=3000
  #   networks:
  #     - cultivo-network
  #   healthcheck:
  #     test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 10s

networks:
  cultivo-network:
    name: cultivo-network
    driver: bridge

volumes:
  tapo-snapshots:
